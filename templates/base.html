<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BankAgent – {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">💳 BankAgent</div>
    <a href="{{ url_for('index') }}"        class="nav-link {% if request.endpoint=='index' %}active{% endif %}">📊 Tableau de bord</a>
    <a href="{{ url_for('transactions') }}" class="nav-link {% if request.endpoint=='transactions' %}active{% endif %}">📄 Transactions</a>
    <a href="{{ url_for('process_folder') }}" class="nav-link">🔄 Analyser dossier</a>
    <a href="{{ url_for('export') }}"       class="nav-link">⬇️ Exporter CSV</a>
  </nav>

  <main class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
